<svg xmlns="http://www.w3.org/2000/svg" width="680" height="564" viewBox="0 0 680 564" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How sysmon's services connect</title>
<desc>mactop and sysmon-procs read macOS, and claude-limits reads Anthropic's usage endpoint. VictoriaMetrics scrapes all three. Claude Code sends its events to an OpenTelemetry collector, which writes them to ClickHouse. Grafana reads VictoriaMetrics and ClickHouse.</desc>
<style>
  .box { fill: #F5F6F7; stroke: #BDC1C6; stroke-width: 1; }
  .region { fill: #FFFFFF; stroke: #D5D8DC; stroke-width: 1; }
  .teal { fill: #DAF0EC; stroke: #7FC4B8; stroke-width: 1; }
  .blue { fill: #E6F1FB; stroke: #8AB4E0; stroke-width: 1; }
  .purple { fill: #EDE7F8; stroke: #A990DC; stroke-width: 1; }
  .th { font-size: 14px; font-weight: 500; fill: #1A1C1E; }
  .ts { font-size: 12px; font-weight: 400; fill: #5E6368; }
  .tl { font-size: 12px; font-weight: 500; fill: #1A1C1E; }
  .arr { stroke: #8A8F94; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8F94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="region" x="20" y="128" width="450" height="300" rx="12"/>
<text class="tl" x="36" y="396" dominant-baseline="central">bin/sysmon metrics</text>
<text class="ts" x="36" y="412" dominant-baseline="central">runs until stopped</text>

<rect class="region" x="486" y="128" width="174" height="300" rx="12"/>
<text class="tl" x="502" y="396" dominant-baseline="central">bin/sysmon telemetry</text>
<text class="ts" x="502" y="412" dominant-baseline="central">starts at login</text>

<rect class="box" x="36" y="40" width="264" height="56" rx="8"/>
<text class="th" x="168" y="58" text-anchor="middle" dominant-baseline="central">macOS</text>
<text class="ts" x="168" y="78" text-anchor="middle" dominant-baseline="central">the machine and each process</text>

<rect class="box" x="320" y="40" width="134" height="72" rx="8"/>
<text class="th" x="387" y="58" text-anchor="middle" dominant-baseline="central">Anthropic API</text>
<text class="ts" x="387" y="78" text-anchor="middle" dominant-baseline="central">every 5 minutes</text>
<text class="ts" x="387" y="96" text-anchor="middle" dominant-baseline="central">Keychain sign-in</text>

<rect class="box" x="502" y="40" width="142" height="56" rx="8"/>
<text class="th" x="573" y="58" text-anchor="middle" dominant-baseline="central">Claude Code</text>
<text class="ts" x="573" y="78" text-anchor="middle" dominant-baseline="central">OTLP events</text>

<line class="arr" x1="103" y1="96" x2="103" y2="176" marker-end="url(#arrow)"/>
<line class="arr" x1="245" y1="96" x2="245" y2="176" marker-end="url(#arrow)"/>
<line class="arr" x1="387" y1="112" x2="387" y2="176" marker-end="url(#arrow)"/>
<line class="arr" x1="573" y1="96" x2="573" y2="176" marker-end="url(#arrow)"/>

<rect class="teal" x="36" y="176" width="134" height="72" rx="8"/>
<text class="th" x="103" y="194" text-anchor="middle" dominant-baseline="central">mactop</text>
<text class="ts" x="103" y="214" text-anchor="middle" dominant-baseline="central">whole machine</text>
<text class="ts" x="103" y="232" text-anchor="middle" dominant-baseline="central">:2112</text>

<rect class="teal" x="178" y="176" width="134" height="72" rx="8"/>
<text class="th" x="245" y="194" text-anchor="middle" dominant-baseline="central">sysmon-procs</text>
<text class="ts" x="245" y="214" text-anchor="middle" dominant-baseline="central">each app</text>
<text class="ts" x="245" y="232" text-anchor="middle" dominant-baseline="central">:2113</text>

<rect class="teal" x="320" y="176" width="134" height="72" rx="8"/>
<text class="th" x="387" y="194" text-anchor="middle" dominant-baseline="central">claude-limits</text>
<text class="ts" x="387" y="214" text-anchor="middle" dominant-baseline="central">plan limits</text>
<text class="ts" x="387" y="232" text-anchor="middle" dominant-baseline="central">:2114</text>

<rect class="purple" x="502" y="176" width="142" height="72" rx="8"/>
<text class="th" x="573" y="194" text-anchor="middle" dominant-baseline="central">Collector</text>
<text class="ts" x="573" y="214" text-anchor="middle" dominant-baseline="central">OpenTelemetry</text>
<text class="ts" x="573" y="232" text-anchor="middle" dominant-baseline="central">:4327</text>

<path class="arr" d="M387 248 L387 272 L245 272"/>
<path class="arr" d="M245 248 L245 272 L103 272"/>
<line class="arr" x1="103" y1="248" x2="103" y2="300" marker-end="url(#arrow)"/>
<text class="ts" x="316" y="261" text-anchor="middle" dominant-baseline="central">scraped</text>

<line class="arr" x1="573" y1="248" x2="573" y2="300" marker-end="url(#arrow)"/>

<rect class="teal" x="36" y="300" width="150" height="72" rx="8"/>
<text class="th" x="111" y="318" text-anchor="middle" dominant-baseline="central">VictoriaMetrics</text>
<text class="ts" x="111" y="338" text-anchor="middle" dominant-baseline="central">:8428</text>
<text class="ts" x="111" y="356" text-anchor="middle" dominant-baseline="central">data/</text>

<rect class="purple" x="502" y="300" width="142" height="72" rx="8"/>
<text class="th" x="573" y="318" text-anchor="middle" dominant-baseline="central">ClickHouse</text>
<text class="ts" x="573" y="338" text-anchor="middle" dominant-baseline="central">:9327</text>
<text class="ts" x="573" y="356" text-anchor="middle" dominant-baseline="central">clickhouse-data/</text>

<path class="arr" d="M186 336 L204 336 L204 496 L220 496" marker-end="url(#arrow)"/>
<path class="arr" d="M502 336 L478 336 L478 496 L460 496" marker-end="url(#arrow)"/>

<rect class="blue" x="220" y="468" width="240" height="56" rx="8"/>
<text class="th" x="340" y="486" text-anchor="middle" dominant-baseline="central">Grafana :3030</text>
<text class="ts" x="340" y="506" text-anchor="middle" dominant-baseline="central">bin/sysmon grafana, until logout</text>
</svg>
