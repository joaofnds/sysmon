receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4327

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:9327
    database: otel
    username: otel
    password: ${file:secrets/clickhouse-otel}
    create_schema: false
    async_insert: false
    sending_queue:
      batch:
        flush_timeout: 10s

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 2115
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
