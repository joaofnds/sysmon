receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4327

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:9327
    database: otel
    username: otel
    password: ${file:secrets/clickhouse-otel}
    create_schema: true

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
